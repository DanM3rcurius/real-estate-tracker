# Ranking weights, gates and the renovation cost model.
scoring:
  weights:
    fit: 0.35
    deal: 0.25
    hidden: 0.15
    freshness: 0.15
    confidence: 0.10

  gates:
    min_confidence_for_shortlist: 60
    min_confidence_to_keep: 50
    renovation_to_price_risk_ratio: 1.5
    exceptional_development_min: 8
    reject_removed: true
    reject_excluded: true
    stale_after_days: 45
    unverified_stale_after_days: 180
    reject_unrouted: false
    shortlist_size: 10
    llm_review_size: 100

  renovation:
    light_min: 200
    light_max: 500
    medium_min: 600
    medium_max: 1100
    heavy_min: 1200
    heavy_max: 1900
    complete_min: 1900
    complete_max: 2700
    roof_per_sqm_footprint: 350
    outbuilding_per_sqm: 450
    utilities_base: 80000
    contingency_pct: 0.20
    immediate_capex_base: 25000
