[project]
name = "hofradar"
version = "0.1.0"
description = "Hofradar - a research platform with memory for finding farmsteads (Hofstellen/Sacherl) in Bavaria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
    "feedparser>=6.0",
    "apscheduler>=3.10",
    "anthropic>=0.40",
]

[project.optional-dependencies]
images = ["Pillow>=11.0", "ImageHash>=4.3"]
pdf = ["pypdf>=5.1"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
hofradar = "hofradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hofradar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
