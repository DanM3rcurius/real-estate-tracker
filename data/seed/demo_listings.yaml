# Synthetic demo listings for the public GitHub Pages snapshot.
#
# Every entry here is INVENTED. The towns and postcodes are real Bavarian
# places so that distances, the radius and the map look right, but no
# farmstead, price, seller or URL below refers to anything that exists. The
# links use the example.invalid TLD, which RFC 2606 reserves precisely so that
# it can never resolve to a real listing.
#
# Nothing here was scraped. This is authored data whose purpose is to give the
# static export something to render, and to let CI exercise the whole read path
# without a database that remembers real searches.
#
# The text fields are written the way a German Exposé is written, because they
# are fed through hofradar.normalize exactly like a crawled listing would be:
# property type, feature tags, price type and the foreclosure / monument /
# private-seller booleans in the snapshot are DERIVED by the real code, not
# declared in this file.
#
# `geo` is supplied per entry rather than geocoded, so seeding never touches
# the network. `driving_km` is omitted wherever a road route was never
# computed - an unknown driving distance stays unknown and never inherits the
# air distance.

meta:
  fictional: true
  note: >
    Erfundene Beispieldaten für die öffentliche Vorschau. Keines dieser
    Objekte existiert.

