name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests must never touch the network; the geo layer resolves from the
      # bundled gazetteer instead.
      HOFRADAR_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf,images]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Smoke - boot the app
        run: |
          hofradar init-db
          hofradar config
          python -c "from hofradar.web.app import app; print('web app imports OK')"
