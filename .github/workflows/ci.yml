name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Nothing here should take five minutes. A step that hangs is a step to
    # kill, not one to let run for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf,images]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Config defaults are in sync
        run: |
          python scripts/sync_config_defaults.py
          git diff --exit-code src/hofradar/_config_defaults

      # The suite mocks every outbound call with respx and asserts on the
      # request that would have been made, so it must NOT run with
      # HOFRADAR_OFFLINE set - that short-circuits the very code paths under
      # test. Tests that want the gazetteer set the variable themselves.
      - name: Test
        run: pytest -q

      # `--sources manual` is what keeps this a smoke test. --dry-run skips
      # only the writes (pipeline/runner.py) - discovery and the crawl still
      # happen, so a bare `hofradar run --dry-run` fetches live pages from the
      # real portals on every push, at the deliberate rate the adapters keep.
      # That is minutes of wall clock, a dependency on somebody else's uptime,
      # and crawling from a shared runner address. The manual source
      # enumerates nothing, so every stage still executes and the run must
      # still finish "ok" - which is what this step is actually asserting.
      - name: Smoke - boot the app
        env:
          HOFRADAR_OFFLINE: "1"
        run: |
          hofradar init-db
          hofradar config
          hofradar run --dry-run --sources manual
          python -c "from hofradar.web.app import app; print('web app imports OK')"

      # Booting against an EXISTING database is the deployment's actual shape,
      # and the one the smoke test above cannot see: `create_all()` is a no-op
      # on a table that already exists, so a missing migration only shows up
      # against a database that predates it (GitHub issue #7).
      - name: Smoke - boot against a database one revision behind
        env:
          HOFRADAR_OFFLINE: "1"
          HOFRADAR_DATABASE_URL: sqlite:///${{ runner.temp }}/existing.sqlite3
        run: |
          alembic -c alembic.ini upgrade a78c19944d2d
          hofradar migrate --check && { echo "expected pending migrations"; exit 1; }
          hofradar init-db
          hofradar migrate --check
