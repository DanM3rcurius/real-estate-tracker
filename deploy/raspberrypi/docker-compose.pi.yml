# Overlay for a Raspberry Pi at home. Always used together with the base file,
# never on its own:
#
#   docker compose -f docker-compose.yml -f deploy/raspberrypi/docker-compose.pi.yml up -d
#
# What it changes, and why the Hetzner overlay is not simply reused:
#
#   - the published address is a variable. A VPS has a public IP and must bind
#     loopback; a Pi is behind the router and should be reachable at
#     http://hofradar.local:8000 from the sofa. HOFRADAR_BIND_ADDR decides.
#   - the database mount is a variable, so it can be moved off the SD card onto
#     a USB SSD without editing a compose file. A path binds, a bare name is a
#     Docker volume.
#   - Caddy sits behind a compose profile instead of always running. Most home
#     lines cannot serve a certificate at all (DS-Lite, see the README), and an
#     idle TLS terminator is 40 MB of a machine that has 2-8 GB.
#   - logging is capped here as well as in daemon.json, because an unbounded
#     json log on an SD card is a slow way to destroy the card.
#
# Requires Docker Compose >= 2.24 for the `!override` tag; the bootstrap
# installs docker-ce from Docker's own repository, which is well past that.
services:
  hofradar:
    ports: !override
      - "${HOFRADAR_BIND_ADDR:-0.0.0.0}:${HOFRADAR_PORT:-8000}:8000"
    volumes: !override
      - ${HOFRADAR_DATA_MOUNT:-hofradar-data}:/data
      - ./config:/app/config:ro
      - ./reports:/app/reports
    environment:
      HOFRADAR_SECRET_KEY: ${HOFRADAR_SECRET_KEY:-}
      HOFRADAR_LLM_MODEL: ${HOFRADAR_LLM_MODEL:-claude-sonnet-5}
      # Set by the bootstrap when TLS is terminated by something that does not
      # set X-Forwarded-Proto - `tailscale serve` being the interesting case.
      HOFRADAR_FORCE_SECURE_COOKIES: ${HOFRADAR_FORCE_SECURE_COOKIES:-}
      TZ: ${TZ:-Europe/Berlin}
    logging: &journal
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    volumes: !override
      - ${HOFRADAR_DATA_MOUNT:-hofradar-data}:/data
      - ./config:/app/config:ro
      - ./reports:/app/reports
    environment:
      HOFRADAR_DATA_DIR: /data
      HOFRADAR_SCHEDULE_CRON: ${HOFRADAR_SCHEDULE_CRON:-0 6 * * 1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HOFRADAR_LLM_MODEL: ${HOFRADAR_LLM_MODEL:-claude-sonnet-5}
      # The scheduler reads TZ directly (hofradar/schedule.py), so a crawl set
      # for Monday 06:00 means 06:00 in Bavaria, not 06:00 UTC.
      TZ: ${TZ:-Europe/Berlin}
    logging: *journal

  # Only started when COMPOSE_PROFILES=proxy, which the bootstrap writes into
  # .env for HOFRADAR_PROXY=caddy.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/raspberrypi/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      HOFRADAR_DOMAIN: ${HOFRADAR_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      - hofradar
    restart: unless-stopped
    logging: *journal

volumes:
  caddy-data:
  caddy-config:
